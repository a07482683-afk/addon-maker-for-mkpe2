name: Build Addon Maker for MCPE

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
  push:
    branches:
      - main
      - phase1-dashboard
      - phase2-texture-events
      - phase3-item-block-editors
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: "x64"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip<25" "setuptools<75" wheel
          python -m pip install -r requirements.txt
      - name: Build standalone EXE
        run: pyinstaller --noconfirm --clean --windowed --name AddonMaker --collect-all PySide2 src/main.py
      - name: Upload EXE folder
        uses: actions/upload-artifact@v4
        with:
          name: AddonMaker-Windows-x64
          path: dist/AddonMaker/
          if-no-files-found: error
